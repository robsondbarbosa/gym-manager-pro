<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GymManager Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="auth-logo-icon">💪</div>
                <h1>GymManager Pro</h1>
                <p>Sistema de Gestão para Academias</p>
            </div>

            <div id="alertContainer"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
                <button class="auth-tab" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="email" class="form-input" id="loginEmail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-auth" id="loginBtn">
                    <span>Entrar</span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-input" id="registerName" placeholder="Seu nome" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="email" class="form-input" id="registerEmail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('registerPassword')">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Senha</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" id="registerPasswordConfirm" placeholder="Repita a senha" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="registerBtn">
                    <span>Criar Conta</span>
                </button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotForm" class="auth-form" onsubmit="handleForgotPassword(event)">
                <div style="text-align: center; margin-bottom: 24px;">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
                    <h3>Recuperar Senha</h3>
                    <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">
                        Digite seu email para receber instruções
                    </p>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="email" class="form-input" id="forgotEmail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="forgotBtn">
                    <span>Enviar Instruções</span>
                </button>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" onclick="showLogin()" style="color: var(--primary); text-decoration: none; font-size: 14px;">
                        ← Voltar para login
                    </a>
                </div>
            </form>

            <div class="auth-divider">ou</div>

            <button class="btn-google" onclick="loginWithGoogle()">
                <span>🔍</span>
                <span>Entrar com Google</span>
            </button>
        </div>

        <div class="auth-footer">
            <p>© 2024 GymManager Pro. Todos os direitos reservados.</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
